[package]
name = "svmscope"
version = "0.2.2"
edition = "2021"
# Verified: the full test suite and all targets compile on 1.91, and the
# dependency tree requires nothing newer.
rust-version = "1.91"
description = "Transaction autopsy for Solana — decode any mainnet transaction, replay it locally in an embedded SVM, and mutate state to see what happens."
license = "MIT"
repository = "https://github.com/alizeeshan1234/svmScope"
readme = "README.md"
keywords = ["solana", "litesvm", "simulator", "transaction", "replay"]
categories = [
    "development-tools::testing",
    "development-tools::debugging",
    "cryptography::cryptocurrencies",
    "simulation",
]
# Publish only the library + binaries; keeps the demo video, web frontend, and
# TS SDK out of the crates.io package (10MB cap).
include = [
    "/src/**",
    "/examples/**",
    "/tests/**",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

# The HTTP API server lives in its own workspace crate (`server/`,
# `svmscope-server`) so library consumers never see axum/tokio at all.
[workspace]
members = ["server"]
resolver = "2"

[dependencies]
base64 = "0.23.1"
bincode = "=1.3.3"
bs58 = "0.5"
flate2 = "1.1.9"
litesvm = "0.15.2"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
serde_json = "1"
solana-account = "=4.3.2"
solana-address = { version = "=2.6.1", features = ["curve25519", "sha2"] }
solana-clock = "=3.1.1"
solana-client = "=4.1.1"
solana-pubkey = "=4.2.1"
solana-transaction = { version = "=4.1.6", features = ["wincode"] }
# Not used directly: caps resolution for consumers. solana-reward-info 6.3+
# switched to wincode 0.6 while solana-transaction-status-client-types 4.1.1
# (via solana-client) still derives wincode 0.5 traits, so a fresh `cargo add
# svmscope` fails to compile without this bound.
solana-reward-info = ">=6.2, <6.3"

solana-instruction = "=3.4.1"
solana-message = "=4.4.1"
solana-signer = "=3.0.1"
sha2 = "0.10"

[dev-dependencies]
# Enables LiteSVM's feature-set accessors (get_feature_set) for tests only;
# not compiled into the normal build.
litesvm = { version = "0.15.2", features = ["internal-test"] }
solana-keypair = "=3.1.2"
solana-system-interface = { version = "=3.2.0", features = ["bincode"] }
