[package]
name = "svmscope"
version = "0.1.0"
edition = "2021"
description = "Transaction autopsy for Solana — paste a transaction, see exactly what happened."

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Add later, when you need them:
# solana-transaction-status = "2"   # typed tx/meta structs (upgrade from serde_json::Value)
# solana-client = "2"               # RpcClient, to fetch live transactions
# regex = "1"                       # parse "consumed N compute units" from logs
# owo-colors = "4"                  # colored tree output
