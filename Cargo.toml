[package]
name = "svmscope"
version = "0.1.0"
edition = "2021"
description = "Transaction autopsy for Solana — paste a transaction, see exactly what happened."

[dependencies]
axum = "0.8.9"
tower-http = { version = "0.6", features = ["cors"] }
base64 = "0.23.1"
bincode = "=1.3.3"
clap = { version = "4", features = ["derive"] }
flate2 = "1.1.9"
litesvm = "0.15.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana-account = "=4.3.2"
solana-address = { version = "=2.6.1", features = ["curve25519", "sha2"] }
solana-clock = "=3.1.1"
solana-client = "=4.1.1"
solana-transaction = "=4.1.6"
tokio = { version = "1.53.1", features = ["full"] }

# Add later, when you need them:
# solana-transaction-status = "2"   # typed tx/meta structs (upgrade from serde_json::Value)
# solana-client = "2"               # RpcClient, to fetch live transactions
# regex = "1"                       # parse "consumed N compute units" from logs
# owo-colors = "4"                  # colored tree output
