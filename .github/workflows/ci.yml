name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Build
        run: cargo build --all-targets --features server
      - name: Test
        run: cargo test --features server
      - name: Clippy
        run: cargo clippy --all-targets --features server -- -D warnings
      - name: Build (library consumers, no server feature)
        run: cargo build
      - name: Package (crates.io dry run)
        run: cargo publish --dry-run
      - name: SDK build
        run: |
          cd sdk
          npm ci || npm install
          npx tsc --noEmit
