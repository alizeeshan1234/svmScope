# Builds the engine's Docker image on GitHub's runners (free for a public
# repository) and publishes it to GitHub's container registry, so Render
# deploys a prebuilt image and spends none of its pipeline minutes building.
#
# Every push to master publishes ghcr.io/<owner>/svmscope:latest and :<sha>.
# With the RENDER_API_KEY and RENDER_SERVICE_ID secrets set, the workflow
# then asks Render to deploy, and Render pulls the new image.
name: image
on:
  push:
    branches: [master]
    paths-ignore:
      - "web/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub's container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Image name (registry paths are lowercase)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/svmscope" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          # The Rust dependency layers are cached between runs; a push that
          # touches only src/ or static/ rebuilds the last layers.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Render has no build to do: it pulls the image just pushed. The
      # service id and an API key live in the repository secrets.
      - name: Tell Render to deploy the new image
        if: ${{ env.KEY != '' }}
        env:
          KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          curl -fsS -X POST "https://api.render.com/v1/services/$SERVICE/deploys" \
            -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" \
            -d '{"clearCache":"do_not_clear"}' > /dev/null && echo "deploy requested"
