# Builds the engine's Docker image on GitHub's runners (free for a public
# repository) and publishes it to GitHub's container registry, so Render
# deploys a prebuilt image and spends none of its pipeline minutes building.
#
# Every push to master publishes ghcr.io/<owner>/svmscope:latest and :<sha>.
# When the RENDER_DEPLOY_HOOK secret is set (Render → the service → Settings
# → Deploy Hook), the workflow pings it and Render pulls the new image.
name: image
on:
  push:
    branches: [master]
    paths-ignore:
      - "web/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub's container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Image name (registry paths are lowercase)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/svmscope" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          # The Rust dependency layers are cached between runs; a push that
          # touches only src/ or static/ rebuilds the last layers.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tell Render to pull the new image
        if: ${{ env.HOOK != '' }}
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl -fsS -X POST "$HOOK" > /dev/null && echo "deploy requested"
