[package]
name = "svmscope-server"
version = "0.6.0"
edition = "2021"
rust-version = "1.93"
description = "HTTP API server over the svmscope engine — deployment infrastructure for the hosted UI, not a library artifact."
license = "MIT"
# Deployed via Docker; intentionally not published to crates.io.
publish = false

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
svmscope = { path = ".." }
axum = { version = "0.8.9", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }
tokio = { version = "1.53.1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
mimalloc = "0.1.52"
# The browser-relayed RPC transport: an `RpcSender` whose requests are answered
# by the reader's own browser, so a local validator needs no engine of its own.
solana-rpc-client = "=4.2.1"
solana-rpc-client-api = "=4.2.1"
async-trait = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
# Relay session ids must be unguessable: the id is what lets a request steer
# somebody's browser at their own machine.
getrandom = "0.3"

[features]
# Single-run debugger (state after every instruction and CPI from one
# execution). Needs the LiteSVM fork + vendored runtime wired through the
# root `[patch.crates-io]`; without it the server builds against upstream
# crates and the debugger uses prefix replays.
single-run = ["svmscope/single-run-trace"]
