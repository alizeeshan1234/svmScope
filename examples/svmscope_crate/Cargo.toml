[workspace]
members = [
    "programs/*"
]
# Standalone svmscope consumer (own lockfile) — keeps litesvm/solana-client
# out of the Anchor program's dependency graph.
exclude = ["scope-test"]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
