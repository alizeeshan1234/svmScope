[toolchain]
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.localnet]
svmscope_crate = "41NQKxFZ2eEAFPSKyP2BEvw2bkxwXjC8Wjrxcy6njF8u"

[programs.devnet]
svmscope_crate = "41NQKxFZ2eEAFPSKyP2BEvw2bkxwXjC8Wjrxcy6njF8u"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 \"tests/**/*.ts\""

[test.validator]
bind_address = "127.0.0.1"
rpc_port = 8896
faucet_port = 9901
gossip_port = 10000
dynamic_port_range = "10001-11000"
